<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 80px 100px;
    font-family: 'DM Sans', sans-serif;
    position: relative;
    overflow: hidden;
  }
  .accent-line {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: #00FF88;
  }
  .logo-row {
    display: flex;
    align-items: flex-end;
    gap: 24px;
    margin-bottom: 32px;
  }
  .logo-img {
    height: 120px;
    width: auto;
    margin-bottom: 0;
  }
  .builders-text {
    font-family: 'Archivo Black', sans-serif;
    font-size: 54px;
    color: #00FF88;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1;
    padding-bottom: 0;
    margin-bottom: 0;
  }
  .tagline {
    font-family: 'Archivo Black', sans-serif;
    font-size: 62px;
    color: #F5F5F3;
    letter-spacing: 0.04em;
    line-height: 1.1;
    margin-bottom: 28px;
    text-transform: uppercase;
  }
  .subtitle {
    font-family: 'DM Sans', sans-serif;
    font-size: 28px;
    font-weight: 400;
    color: #999999;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .domain {
    position: absolute;
    bottom: 60px;
    right: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 22px;
    font-weight: 300;
    color: #555;
    letter-spacing: 0.1em;
  }
  .dots {
    position: absolute;
    bottom: 40px;
    left: 100px;
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00FF88;
    opacity: 0.4;
  }
</style>
</head>
<body>
  <div class="accent-line"></div>
  <div class="logo-row">
    <img src="/lief-logo-green-trimmed.png" class="logo-img" alt="Lief">
    <span class="builders-text">Builders</span>
  </div>
  <div class="tagline">Project Advocacy<br>& Oversight</div>
  <div class="subtitle">Built. Different.</div>
  <div class="domain">liefbuilders.com</div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
