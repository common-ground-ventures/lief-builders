<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 80px 100px;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .accent-line {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: #00FF88;
  }
  .logo-text {
    font-size: 42px;
    font-weight: 900;
    color: #F5F5F3;
    letter-spacing: 0.05em;
    margin-bottom: 24px;
  }
  .tagline {
    font-size: 64px;
    font-weight: 900;
    color: #00FF88;
    letter-spacing: 0.04em;
    line-height: 1.1;
    margin-bottom: 32px;
  }
  .subtitle {
    font-size: 28px;
    font-weight: 400;
    color: #999999;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .domain {
    position: absolute;
    bottom: 60px;
    right: 100px;
    font-size: 24px;
    color: #555;
    letter-spacing: 0.1em;
  }
  .dots {
    position: absolute;
    bottom: 40px;
    left: 100px;
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00FF88;
    opacity: 0.4;
  }
</style>
</head>
<body>
  <div class="accent-line"></div>
  <div class="logo-text">LÏEF BUILDERS</div>
  <div class="tagline">Project Advocacy<br>& Oversight</div>
  <div class="subtitle">Built. Different.</div>
  <div class="domain">liefbuilders.com</div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
